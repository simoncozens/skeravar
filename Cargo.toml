[package]
name = "skeravar"
version = "1.0.1"
description = "Subsetting a font file according to provided input."
readme = "README.md"
categories = ["text-processing"]
exclude = ["/test-data"]

edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simoncozens/skeravar"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bench]]
name = "skera-benchmarks"
harness = false

[[bin]]
name = "skeravar"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["clap", "env_logger"]

[dependencies]
foldhash = { version = "0.2.0", default-features = false }
clap = { version = "4.5.4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

hashbrown = { version = "0.17.0", default-features = false, features = [
    "inline-more",
] }
log = "0.4.29"
regex = "1.10.4"
thiserror = "2.0"
write-fonts = { version = "0.56.0", features = ["read", "tables"] }
read-fonts = { version = "0.47.0", features = ["std"] }
font-types = { version = "0.12.7" }
skrifa = { version = "0.50.0" }


[dev-dependencies]
criterion = "0.7.0"
diff = "0.1.13"
font-test-data = "0.10.2"
libtest-mimic = "0.8.1"
rstest = "0.26.1"
similar = "2.7.0"
tempfile = "3"

[[test]]
name = "integration_test"
harness = false

[lints.clippy]
needless_range_loop = "allow" # Upstream does it all the time
too_many_arguments = "allow"  # This is just complex stuff, man